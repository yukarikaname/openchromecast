[package]
name = "openchromecast"
version = "1.0.0"
edition = "2024"
description = "Chromecast (Google Cast) receiver emulator written in Rust — 'openchromecast'"
license = "MIT"
keywords = ["chromecast", "google-cast", "cast", "receiver", "streaming"]
categories = ["multimedia::streaming"]

[[bin]]
name = "openchromecast"
path = "src/main.rs"

[[bin]]
name = "cast-sniff"
path = "src/bin/sniff.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
local-ip-address = "0.6"
fs4 = "0.9"
ico = "0.3"
mdns-sd = "0.11"
png = "0.17"
prost = "0.13"
rcgen = "0.13"
rsa = { version = "0.9", features = ["pem", "sha2", "getrandom"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
auto-launch = "0.5"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tray-icon = "0.19"
time = { version = "0.3", features = ["std"] }
uuid = { version = "1", features = ["v4"] }
winit = "0.30"

[build-dependencies]
# Embeds assets/icon.ico into the Windows executable (taskbar/Explorer icon).
# Locates rc.exe via vswhere (more reliable than winres on bare rustup+VS).
embed-resource = "2"
