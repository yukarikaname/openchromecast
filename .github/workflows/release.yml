name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      # Off by default: releases are unsigned/ad-hoc for now. Turn this on
      # (workflow_dispatch only) to sign + notarize the macOS .app again.
      macos_signing:
        description: "Sign & notarize the macOS app (Developer ID)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    name: package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            artifact: openchromecast-linux-x86_64
            target: x86_64-unknown-linux-gnu
            pkg: tar
          - name: linux-arm64
            os: ubuntu-24.04-arm
            artifact: openchromecast-linux-arm64
            target: aarch64-unknown-linux-gnu
            pkg: tar
          - name: macos-arm64
            os: macos-latest
            artifact: openchromecast-macos-arm64
            target: aarch64-apple-darwin
            pkg: app
          - name: windows-x86_64
            os: windows-latest
            artifact: openchromecast-windows-x86_64
            target: x86_64-pc-windows-msvc
            pkg: zip
          - name: windows-arm64
            os: windows-latest
            artifact: openchromecast-windows-arm64
            target: aarch64-pc-windows-msvc
            pkg: zip
    runs-on: ${{ matrix.os }}
    env:
      # `secrets` is not allowed directly in `if:` conditions; expose the
      # presence of the signing certificate through a job-level env flag.
      MACOS_CERT_PRESENT: ${{ secrets.MACOS_CERT_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Linux system deps (tray / gtk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libxdo-dev

      - name: Configure MSVC ARM64 cross toolchain
        if: matrix.target == 'aarch64-pc-windows-msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Linux (tar.gz)
        if: matrix.pkg == 'tar'
        run: |
          mkdir -p dist/stage
          cp target/${{ matrix.target }}/release/openchromecast dist/stage/
          tar -czf dist/${{ matrix.artifact }}.tar.gz -C dist/stage openchromecast

      - name: Import Apple Developer ID certificate (release signing)
        if: matrix.pkg == 'app' && env.MACOS_CERT_PRESENT == 'true' && inputs.macos_signing == 'true'
        env:
          MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$MACOS_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p runnerpass "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p runnerpass "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k runnerpass "$KEYCHAIN"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=runnerpass" >> "$GITHUB_ENV"

      - name: Bundle portable mpv (macOS, self-contained)
        if: matrix.pkg == 'app'
        run: |
          # Make a portable mpv so macOS users do not install it. Best-effort:
          # if this fails, the .app ships without mpv and falls back to a
          # system mpv (MPV_BUNDLE_DIR is read by package-macos.sh).
          set -euo pipefail
          brew install mpv dylibbundler >/dev/null 2>&1 || true
          mkdir -p "$RUNNER_TEMP/mpv/bin"
          cp "$(command -v mpv)" "$RUNNER_TEMP/mpv/bin/mpv"
          if command -v dylibbundler >/dev/null 2>&1; then
            dylibbundler -b -x "$RUNNER_TEMP/mpv/bin/mpv" -d "$RUNNER_TEMP/mpv/lib" -p @executable_path/../lib -of || true
          fi
          echo "MPV_BUNDLE_DIR=$RUNNER_TEMP/mpv" >> "$GITHUB_ENV"

      - name: Package macOS (.app, signed, zipped)
        if: matrix.pkg == 'app'
        env:
          # Empty unless macos_signing was enabled on a workflow_dispatch run.
          SIGN_IDENTITY: ${{ inputs.macos_signing == 'true' && secrets.MACOS_SIGN_IDENTITY || '' }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash scripts/package-macos.sh dist/${{ matrix.artifact }}.app.zip

      - name: Package Windows (zip, self-contained mpv)
        if: matrix.pkg == 'zip'
        shell: pwsh
        run: |
          # Self-contained: fetch a portable mpv into the package so users do
          # not have to install anything. (The winget CI.MSVC build is
          # portable: mpv.exe with ffmpeg statically linked + a few DLLs.)
          # Best-effort: if the fetch fails, the release still ships and falls
          # back to a system mpv.
          try {
            winget install --id mpv-player.mpv-CI.MSVC --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
            New-Item -ItemType Directory -Force dist/stage/mpv | Out-Null
            $mpvDir = (Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Packages" -Recurse -Filter mpv.exe -ErrorAction Stop | Select-Object -First 1).DirectoryName
            Get-ChildItem $mpvDir -File | Where-Object { $_.Name -ne 'mpv.pdb' } | Copy-Item -Destination dist/stage/mpv/
            Write-Host "Bundled mpv -> dist/stage/mpv/ ($mpvDir)"
          } catch {
            Write-Warning "Could not bundle mpv ($_) - release will rely on system mpv."
          }
          New-Item -ItemType Directory -Force dist/stage | Out-Null
          Copy-Item target/${{ matrix.target }}/release/openchromecast.exe dist/stage/
          Compress-Archive -Path dist/stage -DestinationPath dist/${{ matrix.artifact }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
