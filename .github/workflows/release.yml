name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            artifact: openchromecast-linux-x86_64
            target: x86_64-unknown-linux-gnu
            pkg: tar
          - name: linux-arm64
            os: ubuntu-24.04-arm
            artifact: openchromecast-linux-arm64
            target: aarch64-unknown-linux-gnu
            pkg: tar
          - name: macos-arm64
            os: macos-latest
            artifact: openchromecast-macos-arm64
            target: aarch64-apple-darwin
            pkg: app
          - name: windows-x86_64
            os: windows-latest
            artifact: openchromecast-windows-x86_64
            target: x86_64-pc-windows-msvc
            pkg: zip
          - name: windows-arm64
            os: windows-latest
            artifact: openchromecast-windows-arm64
            target: aarch64-pc-windows-msvc
            pkg: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Linux system deps (tray / gtk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libxdo-dev

      - name: Configure MSVC ARM64 cross toolchain
        if: matrix.target == 'aarch64-pc-windows-msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Linux (tar.gz)
        if: matrix.pkg == 'tar'
        run: |
          mkdir -p dist/stage
          cp target/${{ matrix.target }}/release/openchromecast dist/stage/
          tar -czf dist/${{ matrix.artifact }}.tar.gz -C dist/stage openchromecast

      - name: Package macOS (.app, signed, zipped)
        if: matrix.pkg == 'app'
        run: bash scripts/package-macos.sh dist/${{ matrix.artifact }}.app.zip

      - name: Package Windows (zip)
        if: matrix.pkg == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/stage | Out-Null
          Copy-Item target/${{ matrix.target }}/release/openchromecast.exe dist/stage/
          Compress-Archive -Path dist/stage -DestinationPath dist/${{ matrix.artifact }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
