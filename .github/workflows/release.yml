name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: openchromecast-linux-x86_64
            pkg: tar
          - os: macos-latest
            artifact: openchromecast-macos-x86_64
            pkg: app
          - os: windows-latest
            artifact: openchromecast-windows-x86_64
            pkg: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Linux system deps (tray / gtk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxkbcommon-dev \
            libwayland-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release

      - name: Package Linux (tar.gz)
        if: matrix.pkg == 'tar'
        run: |
          mkdir -p dist/stage
          cp target/release/openchromecast dist/stage/
          tar -czf dist/${{ matrix.artifact }}.tar.gz -C dist/stage openchromecast

      - name: Package macOS (.app, signed, zipped)
        if: matrix.pkg == 'app'
        run: bash scripts/package-macos.sh dist/${{ matrix.artifact }}.app.zip

      - name: Package Windows (zip)
        if: matrix.pkg == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/stage | Out-Null
          Copy-Item target/release/openchromecast.exe dist/stage/
          Compress-Archive -Path dist/stage -DestinationPath dist/${{ matrix.artifact }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
